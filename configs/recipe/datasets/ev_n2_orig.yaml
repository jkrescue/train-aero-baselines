# Train surface dataset, fold n2 (orig).  Generated by train_aero.data.make_folds.
# Same contract as the official datasets/drivaer_ml_surface.yaml; differences:
#  * no augmentations: RandomRotateMesh would rotate U_inf and destroy the yaw information;
#  * p / wallShearStress are stored in Pa (multiplied by rho during curation);
#  * the wss std is computed from this fold's training split only.

train_datadir: ${dataset_paths.ev_n2_orig}

pipeline:
  reader:
    _target_: ${dp:MeshReaderWithGlobalData}
    path: ${train_datadir}
    pattern: "*/*.pdmsh/_tensordict/boundaries/vehicle"
    subsample_n_cells: ${sampling_resolution}
    merge_global_data_from: "../../global_data"

  augmentations: []

  transforms:
    - _target_: ${dp:CenterMesh}
      use_area_weighting: false

    - _target_: ${dp:NonDimensionalizeByMetadata}
      fields:
        p: pressure
        wallShearStress: stress
      association: cell_data

    - _target_: ${dp:RenameMeshFields}
      cell_data:
        p: pressure
        wallShearStress: wss

    - _target_: ${dp:NormalizeMeshFields}
      association: cell_data
      fields:
        wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.00079768}

    - _target_: ${dp:ComputeSurfaceNormals}
      store_as: cell_data
      field_name: normals

    - _target_: ${dp:SubsampleMesh}
      n_cells: ${sampling_resolution}

    - _target_: ${dp:MeshToDomainMesh}
      interior_points: cell_centroids

targets:
  pressure: scalar
  wss: vector
