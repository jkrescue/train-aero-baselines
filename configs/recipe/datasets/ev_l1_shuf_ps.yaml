# Point-set dataset for AB-UPT, fold l1 (shuf).  Generated by train_aero.data.make_folds.
# Mirrors the official drivaer_ml_surface_point_sets.yaml; only the path, the file pattern,
# the stored field names and the wss std differ.
train_datadir: ${dataset_paths.ev_l1_shuf}
surface_normals_point: inward
wall_shear_acts_on: fluid
independent_validation: true
validation_reader_overrides:
  point_sets:
    interior: {indices_from: null}
pipeline:
  reader:
    _target_: ${dp:DomainMeshReader}
    path: ${train_datadir}
    pattern: "*/domain.pdmsh"
    point_sets:
      interior:
        source: vehicle
        association: cell_centroids
        count: ${sampling_resolution}
        stream: 4
        indices_from: null
        retain_cells_as: vehicle
        fields:
          p: pressure
          wallShearStress: wss
  transforms:
    - _target_: ${dp:NonDimensionalizeByMetadata}
      association: point_data
      fields:
        pressure: pressure
        wss: stress
    - _target_: ${dp:NormalizeMeshFields}
      association: point_data
      fields:
        wss: {type: vector, mean: [0.0, 0.0, 0.0], std: 0.000792836}
targets:
  pressure: scalar
  wss: vector
