precision: float32
profile: false
augment: false
benchmark_io: false
measure_weighted: false
training:
  seed: 1
  save_interval: 25
  loss_type: mse
  mask_nonfinite_targets: false
  batch_size: 1
  scheduler_update_mode: epoch
  optimizer:
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.001
  scheduler: null
dataloader:
  prefetch_factor: 2
  num_streams: 2
  use_streams: true
  num_workers: 2
  pin_memory: true
domain_parallelism:
  domain_size: 1
  auto_shard_size: 10000
  placements: {}
logging:
  log_every_n_steps: 10
input_type: tensors
output_type: tensors
compile: false
forward_kwargs:
  geometry: interior.points
  queries: interior.points
  parameters: global_data.U_hat
  query_features: boundaries.vehicle.cell_data.normals
model:
  _target_: physicsnemo.experimental.models.smart.SMART
  field: surface
  out_dim: ${out_dim}
  query_feature_channels: 3
  parameter_channels: 3
  coordinate_scale:
  - 2.6
  - 0.06839
  - 0.08544
  center_on_geometry: true
  hidden_dim: 448
  num_heads: 8
  num_layers: 6
  num_latents: 2048
  geometry_subsample: 16384
  share_weights: true
  qk_normalization: true
  qk_temperature_max: 4.0
  eval_seed: 0
  eval_chunk_size: 8192
dataset: ev_n2_orig
infer_split: test
train_split: train
val_split: ${infer_split}
checkpoint_dir: ${TRAIN_AERO_WORKDIR}/runs/noses/smart/n2/seed1
run_id: train
checkpoint_path: null
output_dir: ${TRAIN_AERO_WORKDIR}/runs/noses/smart/n2/seed1/infer
redimensionalize: true
rescale_geometry: false
sampling_resolution: 10000000
metrics:
- l2
force_coefficients:
  enabled: true
  reference_area: 11.0888
  reference_length: null
  moment_center:
  - 0.0
  - 0.0
  - 0.0
  up_direction:
  - 0.0
  - 0.0
  - 1.0
