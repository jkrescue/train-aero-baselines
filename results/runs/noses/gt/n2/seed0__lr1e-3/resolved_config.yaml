precision: float32
profile: false
augment: false
benchmark_io: false
measure_weighted: false
training:
  seed: 0
  save_interval: 100
  loss_type: huber
  mask_nonfinite_targets: false
  batch_size: 1
  scheduler_update_mode: epoch
  optimizer:
    weight_decay: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.001
  scheduler:
    _target_: torch.optim.lr_scheduler.StepLR
    step_size: 150
    gamma: 0.1
  num_epochs: 300
dataloader:
  prefetch_factor: 4
  num_streams: 4
  use_streams: true
  num_workers: 4
  pin_memory: true
domain_parallelism:
  domain_size: 1
  auto_shard_size: 10000
  placements: {}
logging:
  log_every_n_steps: 10
dataset: ev_n2_shuf
extra_datasets: []
train_split: train
val_split: val
sampling_resolution: 32000
metrics:
- l2
run_id: train
output_dir: ${TRAIN_AERO_WORKDIR}/runs/noses/gt/n2/seed0__lr1e-3
checkpoint_dir: null
compile: false
input_type: tensors
output_type: tensors
forward_kwargs:
  geometry: interior.points
  local_embedding:
  - interior.points
  - boundaries.vehicle.cell_data.normals
  local_positions: interior.points
  global_embedding: global_data.U_hat
model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: 4
  functional_dim: 6
  geometry_dim: 3
  global_dim: 3
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: gelu
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  radii:
  - 0.1
  - 0.5
  - 2.0
  neighbors_in_radius:
  - 16
  - 32
  - 64
  n_hidden_local: 32
  state_mixing_mode: weighted
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components:
  - blocks
out_dim: 4
